<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Med-Study Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .gold-glow { box-shadow: 0 0 20px rgba(251, 191, 36, 0.6); }
        .progress-pulse { animation: pulse-gold 2s infinite; }
        @keyframes pulse-gold {
            0% { box-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }
            50% { box-shadow: 0 0 25px rgba(251, 191, 36, 0.8); }
            100% { box-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { Play, Pause, Square, CheckCircle, SkipForward, Coffee, LogOut, Sparkles } = window.lucide;
        
        // --- CONFIGURE YOUR SUPABASE HERE ---
        const SUPABASE_URL = 'https://lkltuvpdrebexvoekywb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxrbHR1dnBkcmViZXh2b2VreXdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NTIzMTksImV4cCI6MjEwNDAyODMxOX0.cCgvCZ7eZFqefAEp3aiEzqFfI3bBsZMN4fd1ujsdBNE'; 
        
        const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        const STUDY_DURATION = 50 * 60; // 50 mins
        const BREAK_DURATION = 10 * 60; // 10 mins

        const initialSchedule = {
          day1: [
            { id: 'm1', name: 'Medicine', target: 4, completed: 0, subtopics: [] },
            { id: 's1', name: 'Surgery', target: 4, completed: 0, subtopics: [] },
            { id: 'c1', name: 'Commed', target: 4, completed: 0, subtopics: [] },
            { id: 'p1', name: 'Psychiatry', target: 2, completed: 0, subtopics: [] },
          ],
          day2: [
            { id: 'pe1', name: 'Pediatrics', target: 4, completed: 0, subtopics: [] },
            { id: 'g1', name: 'Gyn & Obs', target: 4, completed: 0, subtopics: [] },
            { id: 'f1', name: 'Forensic', target: 4, completed: 0, subtopics: [] },
            { id: 'p2', name: 'Psychiatry', target: 2, completed: 0, subtopics: [] },
          ]
        };

        // --- Audio Notification Function ---
        const playBeep = (type) => {
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gainNode = ctx.createGain();
            osc.connect(gainNode);
            gainNode.connect(ctx.destination);
            
            if (type === 'study-end') {
              osc.type = 'sine'; // Smooth tone for break time
              osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
              osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.2); // E5
            } else {
              osc.type = 'triangle'; // Sharp tone for get back to work
              osc.frequency.setValueAtTime(880, ctx.currentTime); // A5
              osc.frequency.setValueAtTime(440, ctx.currentTime + 0.2); // A4
            }
            
            gainNode.gain.setValueAtTime(0.5, ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.8);
          } catch (err) {
            console.log("Audio blocked by browser", err);
          }
        };

        function App() {
          // Auth State
          const [user, setUser] = useState(null);
          const [authEmail, setAuthEmail] = useState('');
          const [authPassword, setAuthPassword] = useState('');
          const [isLoginView, setIsLoginView] = useState(true);
          const [authError, setAuthError] = useState('');
          const [authLoading, setAuthLoading] = useState(false);
          const [rememberMe, setRememberMe] = useState(true);

          // Tracker State
          const getTodayString = () => new Date().toISOString().split('T')[0];
          const [selectedDate, setSelectedDate] = useState(getTodayString());
          const [currentDay, setCurrentDay] = useState('day1');
          const [scheduleData, setScheduleData] = useState({});
          
          const [newSubtopicText, setNewSubtopicText] = useState({});
          
          const [timerMode, setTimerMode] = useState('idle');
          const [timeRemaining, setTimeRemaining] = useState(0);
          const [isRunning, setIsRunning] = useState(false);
          const [activeSubjectId, setActiveSubjectId] = useState(null);

          // --- Authentication Check ---
          useEffect(() => {
            if (!supabase) return;
            supabase.auth.getSession().then(({ data: { session } }) => {
              setUser(session?.user ?? null);
            });
            const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
              setUser(session?.user ?? null);
            });
            return () => subscription.unsubscribe();
          }, []);

          const handleAuth = async (e) => {
            e.preventDefault();
            setAuthLoading(true);
            setAuthError('');
            
            try {
              if (isLoginView) {
                const { error } = await supabase.auth.signInWithPassword({ email: authEmail, password: authPassword });
                if (error) throw error;
              } else {
                const { error } = await supabase.auth.signUp({ email: authEmail, password: authPassword });
                if (error) throw error;
                alert("Account created! You are now logged in.");
              }
            } catch (err) {
              setAuthError(err.message);
            } finally {
              setAuthLoading(false);
            }
          };

          const handleLogout = async () => {
            if (window.confirm("Are you sure you want to log out?")) {
              await supabase.auth.signOut();
            }
          };

          // --- Bulletproof Data Fetching & Smart Merging ---
          useEffect(() => {
            async function fetchData() {
              if (!supabase || !user) return;
              
              try {
                // Use .select() instead of .single() to avoid 406 Not Found errors on empty days
                const { data, error } = await supabase
                  .from('study_records')
                  .select('data')
                  .eq('user_id', user.id)
                  .eq('date_key', selectedDate);
                
                if (error) throw error;

                if (data && data.length > 0) {
                  const savedData = data[0].data;
                  
                  // SMART MERGE: Keep saved checkmarks and hours, but pull in new template structure
                  const mergeDay = (savedDay, initialDay) => {
                    return initialDay.map(initialSubj => {
                      const savedSubj = (savedDay || []).find(s => s.id === initialSubj.id);
                      if (savedSubj) {
                        return { ...initialSubj, completed: savedSubj.completed, subtopics: savedSubj.subtopics || [] };
                      }
                      return initialSubj;
                    });
                  };

                  const mergedData = {
                    day1: mergeDay(savedData.day1, initialSchedule.day1),
                    day2: mergeDay(savedData.day2, initialSchedule.day2)
                  };

                  setScheduleData(prev => ({ ...prev, [selectedDate]: mergedData }));
                } else {
                  // No data found for this date, load fresh template
                  setScheduleData(prev => ({ ...prev, [selectedDate]: initialSchedule }));
                }
              } catch (err) {
                console.error("Error fetching data:", err);
              }
            }
            fetchData();
          }, [selectedDate, user]);

          // --- Bulletproof Data Saving ---
          const saveToSupabase = async (newDateData) => {
            // Update UI instantly
            setScheduleData(prev => ({ ...prev, [selectedDate]: newDateData }));
            
            if (!supabase || !user) return;
            
            try {
              // 1. Check if row exists
              const { data: existing } = await supabase
                .from('study_records')
                .select('id')
                .eq('user_id', user.id)
                .eq('date_key', selectedDate);

              if (existing && existing.length > 0) {
                // 2a. Update existing row
                await supabase
                  .from('study_records')
                  .update({ data: newDateData })
                  .eq('id', existing[0].id);
              } else {
                // 2b. Insert new row
                await supabase
                  .from('study_records')
                  .insert([{ user_id: user.id, date_key: selectedDate, data: newDateData }]);
              }
            } catch (err) {
              console.error("Error saving data:", err);
            }
          };

          // --- Timer Logic ---
          useEffect(() => {
            let interval = null;
            if (isRunning && timeRemaining > 0) {
              interval = setInterval(() => setTimeRemaining(prev => prev - 1), 1000);
            } else if (isRunning && timeRemaining === 0) {
              handleTimerComplete();
            }
            return () => clearInterval(interval);
          }, [isRunning, timeRemaining]);

          const handleTimerComplete = () => {
            if (timerMode === 'study') {
              playBeep('study-end'); // Play Chime
              if (activeSubjectId) {
                const currentSchedule = scheduleData[selectedDate] || initialSchedule;
                const updatedDay = currentSchedule[currentDay].map(subject => 
                  subject.id === activeSubjectId ? { ...subject, completed: subject.completed + 1 } : subject
                );
                saveToSupabase({ ...currentSchedule, [currentDay]: updatedDay });
              }
              setTimerMode('break');
              setTimeRemaining(BREAK_DURATION);
              setIsRunning(true);
              
            } else if (timerMode === 'break') {
              playBeep('break-end'); // Play Chime
              setTimerMode('idle');
              setActiveSubjectId(null);
              setIsRunning(false);
            }
          };

          const startStudySession = (subjectId) => {
            setActiveSubjectId(subjectId);
            setTimerMode('study');
            setTimeRemaining(STUDY_DURATION);
            setIsRunning(true);
          };

          const toggleTimer = () => setIsRunning(!isRunning);
          const stopTimer = () => { setIsRunning(false); setTimerMode('idle'); setActiveSubjectId(null); setTimeRemaining(0); };
          const skipTimer = () => setTimeRemaining(0);

          // --- Subtopics Logic ---
          const addSubtopic = (subjectId) => {
            const text = (newSubtopicText[subjectId] || '').trim();
            if (!text) return;
            const currentSchedule = scheduleData[selectedDate] || initialSchedule;
            const updatedDay = currentSchedule[currentDay].map(subject => {
              if (subject.id === subjectId) {
                const newSub = { id: 'sub_' + Date.now(), name: text, completed: false };
                return { ...subject, subtopics: [...(subject.subtopics || []), newSub] };
              }
              return subject;
            });
            saveToSupabase({ ...currentSchedule, [currentDay]: updatedDay });
            setNewSubtopicText({ ...newSubtopicText, [subjectId]: '' });
          };

          const toggleSubtopic = (subjectId, subtopicId) => {
            const currentSchedule = scheduleData[selectedDate] || initialSchedule;
            const updatedDay = currentSchedule[currentDay].map(subject => {
              if (subject.id === subjectId) {
                const updatedSubs = (subject.subtopics || []).map(sub => 
                  sub.id === subtopicId ? { ...sub, completed: !sub.completed } : sub
                );
                return { ...subject, subtopics: updatedSubs };
              }
              return subject;
            });
            saveToSupabase({ ...currentSchedule, [currentDay]: updatedDay });
          };

          const deleteSubtopic = (subjectId, subtopicId) => {
            const currentSchedule = scheduleData[selectedDate] || initialSchedule;
            const updatedDay = currentSchedule[currentDay].map(subject => {
              if (subject.id === subjectId) {
                const updatedSubs = (subject.subtopics || []).filter(sub => sub.id !== subtopicId);
                return { ...subject, subtopics: updatedSubs };
              }
              return subject;
            });
            saveToSupabase({ ...currentSchedule, [currentDay]: updatedDay });
          };

          const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
          };

          // --- Render Auth View ---
          if (!user) {
            return (
              <div className="min-h-screen flex items-center justify-center p-4">
                <div className="bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-xl w-full max-w-md">
                  <h1 className="text-3xl font-extrabold text-cyan-400 mb-2 flex items-center gap-2">
                    Med-Study <span className="text-violet-400">Tracker</span> 🚀
                  </h1>
                  <p className="text-slate-400 mb-6">Log in to sync your study data to the cloud.</p>
                  
                  {authError && <div className="bg-rose-900/30 text-rose-400 p-3 rounded-lg mb-4 text-sm border border-rose-800/50">{authError}</div>}
                  
                  <form onSubmit={handleAuth} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-400 mb-1">EMAIL</label>
                      <input type="email" required value={authEmail} onChange={e => setAuthEmail(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 outline-none focus:border-cyan-500 transition" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-400 mb-1">PASSWORD</label>
                      <input type="password" required value={authPassword} onChange={e => setAuthPassword(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 outline-none focus:border-cyan-500 transition" />
                    </div>
                    
                    <div className="flex items-center gap-2 mt-2">
                      <input type="checkbox" id="remember" checked={rememberMe} onChange={() => setRememberMe(!rememberMe)} className="w-4 h-4 accent-cyan-500 cursor-pointer" />
                      <label htmlFor="remember" className="text-sm text-slate-400 cursor-pointer">Remember me</label>
                    </div>

                    <button type="submit" disabled={authLoading} className="w-full bg-gradient-to-r from-cyan-600 to-violet-600 hover:from-cyan-500 hover:to-violet-500 text-white font-bold py-3 rounded-xl shadow-lg transition disabled:opacity-50 mt-2">
                      {authLoading ? 'Processing...' : isLoginView ? 'Sign In' : 'Create Account'}
                    </button>
                  </form>
                  
                  <p className="text-center text-sm text-slate-400 mt-6 cursor-pointer hover:text-cyan-400" onClick={() => setIsLoginView(!isLoginView)}>
                    {isLoginView ? "Don't have an account? Sign up" : "Already have an account? Sign in"}
                  </p>
                </div>
              </div>
            );
          }

          // --- Main App Logic ---
          const currentSubjects = (scheduleData[selectedDate] || initialSchedule)[currentDay] || [];
          const activeSubject = currentSubjects.find(s => s.id === activeSubjectId);
          
          // Calculate 14 Hour Progress (Targeting 14 total hours across both days)
          const allSubjectsDay1 = (scheduleData[selectedDate] || initialSchedule).day1 || [];
          const allSubjectsDay2 = (scheduleData[selectedDate] || initialSchedule).day2 || [];
          const totalCompletedHours = allSubjectsDay1.reduce((acc, curr) => acc + curr.completed, 0) + 
                                      allSubjectsDay2.reduce((acc, curr) => acc + curr.completed, 0);
          
          const targetHours = 14; 
          const isTargetMet = totalCompletedHours >= targetHours;
          const progressPercent = Math.min(100, (totalCompletedHours / targetHours) * 100);

          return (
            <div className="max-w-5xl mx-auto space-y-6 p-4 md:p-8">
              
              {/* Header */}
              <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl relative overflow-hidden">
                <div className="relative z-10">
                  <h1 className="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-violet-400 to-fuchsia-400">
                    Med-Study Tracker
                  </h1>
                  <p className="text-slate-400 text-sm mt-1">Logged in as {user.email}</p>
                </div>

                <div className="flex flex-wrap gap-3 items-center relative z-10">
                  <input type="date" value={selectedDate} onChange={(e) => { setSelectedDate(e.target.value); stopTimer(); }} className="bg-slate-950 border border-slate-700 text-slate-200 text-sm rounded-xl p-2.5 outline-none cursor-pointer" />
                  
                  <div className="flex bg-slate-950 p-1 rounded-2xl border border-slate-800">
                    <button onClick={() => { setCurrentDay('day1'); stopTimer(); }} className={`px-4 py-2 rounded-xl font-bold text-sm transition-all ${currentDay === 'day1' ? 'bg-slate-800 text-violet-400' : 'text-slate-500'}`}>Day 1</button>
                    <button onClick={() => { setCurrentDay('day2'); stopTimer(); }} className={`px-4 py-2 rounded-xl font-bold text-sm transition-all ${currentDay === 'day2' ? 'bg-slate-800 text-violet-400' : 'text-slate-500'}`}>Day 2</button>
                  </div>
                  
                  <button onClick={handleLogout} className="p-2.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-rose-400 transition" title="Log Out">
                    <i data-lucide="log-out"></i> <LogOut size={18} />
                  </button>
                </div>
              </header>

              {/* 14-HOUR PROGRESS BAR */}
              <div className={`bg-slate-900 p-6 rounded-3xl border ${isTargetMet ? 'border-amber-500 gold-glow progress-pulse' : 'border-slate-800'}`}>
                <div className="flex justify-between items-end mb-2">
                  <div>
                    <h2 className={`font-extrabold text-lg flex items-center gap-2 ${isTargetMet ? 'text-amber-400' : 'text-slate-200'}`}>
                      Daily Target: 14 Hours {isTargetMet && '🏆'}
                    </h2>
                    <p className="text-xs text-slate-400">Combined completed sessions across Day 1 & Day 2</p>
                  </div>
                  <span className={`font-bold text-xl ${isTargetMet ? 'text-amber-400' : 'text-cyan-400'}`}>
                    {totalCompletedHours} / 14
                  </span>
                </div>
                
                <div className="h-4 w-full bg-slate-950 rounded-full overflow-hidden shadow-inner border border-slate-800">
                  <div 
                    className={`h-full transition-all duration-1000 ease-out ${isTargetMet ? 'bg-gradient-to-r from-amber-400 to-yellow-300' : 'bg-gradient-to-r from-cyan-500 to-violet-500'}`}
                    style={{ width: `${progressPercent}%` }}
                  ></div>
                </div>
                
                {isTargetMet && (
                  <p className="text-amber-400 text-center font-bold mt-3 text-sm animate-bounce flex justify-center items-center gap-2">
                    <Sparkles size={16} /> Incredible! You hit your 14-hour study goal! <Sparkles size={16} />
                  </p>
                )}
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                
                {/* Timer Box */}
                <div className="lg:col-span-5 bg-slate-900 p-6 md:p-8 rounded-3xl border border-slate-800 flex flex-col items-center justify-center text-center shadow-lg relative overflow-hidden h-fit">
                   <div className={`absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 rounded-full blur-3xl opacity-10 pointer-events-none transition-all duration-1000 ${timerMode === 'study' ? 'bg-violet-500' : timerMode === 'break' ? 'bg-cyan-500' : 'bg-transparent'}`}></div>

                  {timerMode === 'idle' ? (
                    <div className="mb-6 relative z-10">
                      <h2 className="text-xl font-bold text-slate-300">Ready to Focus?</h2>
                      <p className="text-sm text-slate-500 mt-1">Select a subject to start 50m.</p>
                    </div>
                  ) : (
                    <div className="mb-6 relative z-10">
                      <span className={`px-4 py-1.5 rounded-full text-xs font-bold border ${timerMode === 'study' ? 'bg-violet-900/40 text-violet-300 border-violet-700/50' : 'bg-cyan-900/40 text-cyan-300 border-cyan-700/50'}`}>
                        {timerMode === 'study' ? 'Focus Session' : 'Break Time'}
                      </span>
                      {timerMode === 'study' && activeSubject && <h3 className="text-2xl font-bold text-slate-100 mt-3">{activeSubject.name}</h3>}
                    </div>
                  )}

                  <div className={`text-7xl font-black mb-8 relative z-10 tabular-nums tracking-tight ${timerMode === 'idle' ? 'text-slate-700' : timerMode === 'break' ? 'text-cyan-400' : 'text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-fuchsia-400'}`}>
                    {timerMode === 'idle' ? '50:00' : formatTime(timeRemaining)}
                  </div>

                  <div className="flex gap-4 relative z-10">
                    <button onClick={toggleTimer} disabled={timerMode === 'idle'} className={`p-5 rounded-full flex items-center justify-center transition-all ${timerMode === 'idle' ? 'bg-slate-800 text-slate-600 cursor-not-allowed' : isRunning ? 'bg-amber-600 text-white shadow-lg' : 'bg-violet-600 text-white shadow-lg'}`}>
                      {isRunning ? <Pause size={28} fill="currentColor"/> : <Play size={28} fill="currentColor" className="ml-1"/>}
                    </button>
                    <button onClick={stopTimer} disabled={timerMode === 'idle'} className="p-4 rounded-full bg-slate-800 text-slate-400 disabled:opacity-30 hover:bg-slate-700 hover:text-rose-400 transition-colors">
                      <Square size={20} fill="currentColor"/>
                    </button>
                    <button onClick={skipTimer} disabled={timerMode === 'idle'} className="p-4 rounded-full bg-slate-800 text-slate-400 disabled:opacity-30 hover:bg-slate-700 hover:text-cyan-400 transition-colors">
                      <SkipForward size={20} />
                    </button>
                  </div>
                </div>

                {/* Schedule & Subtopics */}
                <div className="lg:col-span-7 bg-slate-900 p-6 md:p-8 rounded-3xl border border-slate-800 space-y-4 h-fit">
                  <h2 className="text-xl font-extrabold text-slate-100 flex items-center gap-2">
                    {currentDay === 'day1' ? 'Day 1 Schedule' : 'Day 2 Schedule'}
                  </h2>
                  
                  {currentSubjects.map(subject => {
                    const isComplete = subject.completed >= subject.target;
                    const isActive = activeSubjectId === subject.id && timerMode === 'study';

                    return (
                      <div key={subject.id} className={`p-4 md:p-5 rounded-2xl border-2 transition-all ${isActive ? 'border-violet-500 bg-violet-950/20' : isComplete ? 'border-cyan-800/50 bg-cyan-900/10' : 'border-slate-800 bg-slate-950/40'}`}>
                        <div className="flex items-center justify-between mb-3">
                          <div>
                            <h3 className={`font-bold text-lg flex items-center gap-2 ${isActive ? 'text-violet-300' : isComplete ? 'text-cyan-400' : 'text-slate-200'}`}>
                              {subject.name} {isComplete && <CheckCircle size={16} className="text-cyan-500"/>}
                            </h3>
                            <p className="text-xs text-slate-400 mt-1">{subject.completed} / {subject.target} sessions completed</p>
                          </div>
                          <button onClick={() => startStudySession(subject.id)} disabled={isActive} className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${isActive ? 'bg-violet-900/30 text-violet-500 cursor-not-allowed' : 'bg-slate-800 text-violet-400 hover:bg-violet-600 hover:text-white'}`}>
                            {isActive ? 'Running' : 'Start 50m'}
                          </button>
                        </div>

                        <div className="h-2 w-full bg-slate-950 rounded-full overflow-hidden border border-slate-800 mb-3">
                          <div className={`h-full ${isComplete ? 'bg-cyan-500' : 'bg-violet-500'}`} style={{ width: `${Math.min(100, (subject.completed / subject.target) * 100)}%` }}></div>
                        </div>

                        {/* Subtopics Checklist */}
                        <div className="pt-3 border-t border-slate-800/80 space-y-2">
                          {subject.subtopics && subject.subtopics.map(sub => (
                            <div key={sub.id} className="flex items-center justify-between bg-slate-900 px-3 py-2 rounded-xl border border-slate-800 group">
                              <span onClick={() => toggleSubtopic(subject.id, sub.id)} className={`text-sm cursor-pointer flex-grow ${sub.completed ? 'line-through text-slate-500' : 'text-slate-300'}`}>
                                {sub.name}
                              </span>
                              <button onClick={() => deleteSubtopic(subject.id, sub.id)} className="text-slate-500 hover:text-rose-400 opacity-0 group-hover:opacity-100 transition-opacity">×</button>
                            </div>
                          ))}
                          <div className="flex gap-2 mt-2">
                            <input 
                              type="text" 
                              value={newSubtopicText[subject.id] || ''}
                              onChange={(e) => setNewSubtopicText({ ...newSubtopicText, [subject.id]: e.target.value })}
                              onKeyDown={(e) => { if(e.key === 'Enter') addSubtopic(subject.id); }}
                              placeholder="Add subtopic..."
                              className="bg-slate-950 border border-slate-800 text-xs text-slate-200 rounded-xl px-3 py-2 flex-grow outline-none focus:border-cyan-500"
                            />
                            <button onClick={() => addSubtopic(subject.id)} className="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-xs font-semibold transition-colors text-slate-200">Add</button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

            </div>
          );
        }

        // Wait for React to load, then render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
