<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Med-Study Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // --- CONFIGURE YOUR SUPABASE HERE ---
        const SUPABASE_URL = 'https://lkltuvpdrebexvoekywb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxrbHR1dnBkcmViZXh2b2VreXdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NTIzMTksImV4cCI6MjEwNDAyODMxOX0.cCgvCZ7eZFqefAEp3aiEzqFfI3bBsZMN4fd1ujsdBNE'; 
        
        const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
          }
        }) : null;

        const STUDY_DURATION = 50 * 60;
        const BREAK_DURATION = 10 * 60;

        const initialSchedule = {
          day1: [
            { id: 'm1', name: 'Medicine', target: 4, completed: 0, subtopics: [] },
            { id: 's1', name: 'Surgery', target: 4, completed: 0, subtopics: [] },
            { id: 'c1', name: 'Commed', target: 4, completed: 0, subtopics: [] },
            { id: 'p1', name: 'Psychiatry', target: 2, completed: 0, subtopics: [] },
          ],
          day2: [
            { id: 'pe1', name: 'Pediatrics', target: 4, completed: 0, subtopics: [] },
            { id: 'g1', name: 'Gyn & Obs', target: 4, completed: 0, subtopics: [] },
            { id: 'f1', name: 'Forensic', target: 4, completed: 0, subtopics: [] },
            { id: 'p2', name: 'Psychiatry', target: 2, completed: 0, subtopics: [] },
          ]
        };

        // --- AUDIO NOTIFICATION HELPER ---
        const playChime = (type) => {
          try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'study_complete') {
              osc.type = 'sine';
              osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
              osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15); // A5
              gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
              osc.start();
              osc.stop(audioCtx.currentTime + 0.6);
            } else if (type === 'break_complete') {
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(440, audioCtx.currentTime); // A4
              osc.frequency.setValueAtTime(330, audioCtx.currentTime + 0.2); // E4
              gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
              osc.start();
              osc.stop(audioCtx.currentTime + 0.6);
            }
          } catch (e) {
            console.log("Audio not supported or blocked", e);
          }
        };

        function App() {
          const [user, setUser] = useState(null);
          const [authEmail, setAuthEmail] = useState('');
          const [authPassword, setAuthPassword] = useState('');
          const [rememberMe, setRememberMe] = useState(true);
          const [isSignUp, setIsSignUp] = useState(false);
          const [authError, setAuthError] = useState('');

          const getTodayString = () => new Date().toISOString().split('T')[0];
          const [selectedDate, setSelectedDate] = useState(getTodayString());
          const [currentDay, setCurrentDay] = useState('day1');
          const [activeTab, setActiveTab] = useState('tracker');
          const [scheduleData, setScheduleData] = useState({});
          
          const [newSubtopicText, setNewSubtopicText] = useState({});
          const [editingSubtopicId, setEditingSubtopicId] = useState(null);
          const [editSubtopicText, setEditSubtopicText] = useState('');

          // AI Chat State
          const [chatMessages, setChatMessages] = useState([
            { role: 'model', text: 'Hello! I am your AI Medical Study Coach powered by Gemini. Ask me for study tips, quick summaries, or motivation for your 50/10 sessions!' }
          ]);
          const [userInput, setUserInput] = useState('');
          const [isAiLoading, setIsAiLoading] = useState(false);

          // Check active session on load & handle persistence
          useEffect(() => {
            if (!supabase) return;
            
            supabase.auth.getSession().then(({ data: { session } }) => {
              setUser(session?.user ?? null);
            });

            const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
              setUser(session?.user ?? null);
            });

            return () => subscription.unsubscribe();
          }, []);

          // Fetch from Supabase on date change or login with smart merge so user data is never lost
          useEffect(() => {
            async function fetchData() {
              if (!supabase || !user) return;
              const { data } = await supabase
                .from('study_records')
                .select('*')
                .eq('user_id', user.id)
                .eq('date_key', selectedDate)
                .single();
              
              if (data && data.data) {
                // Merge saved user data with initialSchedule template to preserve completed hours & subtopics
                const savedDay1 = data.data.day1 || initialSchedule.day1;
                const savedDay2 = data.data.day2 || initialSchedule.day2;
                
                const mergedDay1 = initialSchedule.day1.map(defaultSub => {
                  const found = savedDay1.find(s => s.id === defaultSub.id);
                  return found ? { ...defaultSub, ...found } : defaultSub;
                });
                const mergedDay2 = initialSchedule.day2.map(defaultSub => {
                  const found = savedDay2.find(s => s.id === defaultSub.id);
                  return found ? { ...defaultSub, ...found } : defaultSub;
                });

                setScheduleData(prev => ({ 
                  ...prev, 
                  [selectedDate]: { day1: mergedDay1, day2: mergedDay2 } 
                }));
              } else {
                setScheduleData(prev => ({ ...prev, [selectedDate]: initialSchedule }));
              }
            }
            fetchData();
          }, [selectedDate, user]);

          const handleAuth = async (e) => {
            e.preventDefault();
            setAuthError('');
            if (!supabase) return;
            
            if (isSignUp) {
              const { error } = await supabase.auth.signUp({ email: authEmail, password: authPassword });
              if (error) setAuthError(error.message);
              else alert('Signup successful! You can now log in.');
            } else {
              const { error } = await supabase.auth.signInWithPassword({ email: authEmail, password: authPassword });
              if (error) setAuthError(error.message);
            }
          };

          const handleLogout = async () => {
            if (supabase) await supabase.auth.signOut();
          };

          const schedule = scheduleData[selectedDate] || initialSchedule;
          const activeSubjectId = scheduleData[`${selectedDate}_activeSubject`] || null;

          const setActiveSubjectId = (id) => {
            const updated = { ...scheduleData, [`${selectedDate}_activeSubject`]: id };
            saveToSupabase(updated);
          };

          const [timerMode, setTimerMode] = useState('idle');
          const [timeRemaining, setTimeRemaining] = useState(0);
          const [isRunning, setIsRunning] = useState(false);

          const saveToSupabase = async (newFullState) => {
            setScheduleData(newFullState);
            if (!supabase || !user) return;
            const currentDayData = newFullState[selectedDate] || initialSchedule;
            
            await supabase
              .from('study_records')
              .upsert({ user_id: user.id, date_key: selectedDate, data: currentDayData }, { onConflict: 'user_id,date_key' });
          };

          // Timer Countdown Logic
          useEffect(() => {
            let interval = null;
            if (isRunning && timeRemaining > 0) {
              interval = setInterval(() => setTimeRemaining(prev => prev - 1), 1000);
            } else if (isRunning && timeRemaining === 0) {
              handleTimerComplete();
            }
            return () => clearInterval(interval);
          }, [isRunning, timeRemaining]);

          const handleTimerComplete = () => {
            if (timerMode === 'study') {
              playChime('study_complete');
              if (activeSubjectId) {
                const currentSchedule = scheduleData[selectedDate] || initialSchedule;
                const updatedDay = currentSchedule[currentDay].map(subject => 
                  subject.id === activeSubjectId ? { ...subject, completed: subject.completed + 1 } : subject
                );
                const newFull = { ...scheduleData, [selectedDate]: { ...currentSchedule, [currentDay]: updatedDay } };
                saveToSupabase(newFull);
              }
              setTimerMode('break');
              setTimeRemaining(BREAK_DURATION);
              setIsRunning(true);
            } else if (timerMode === 'break') {
              playChime('break_complete');
              setTimerMode('idle');
              setActiveSubjectId(null);
              setIsRunning(false);
            }
          };

          const startStudySession = (subjectId) => {
            setActiveSubjectId(subjectId);
            setTimerMode('study');
            setTimeRemaining(STUDY_DURATION);
            setIsRunning(true);
          };

          const toggleTimer = () => setIsRunning(!isRunning);
          const stopTimer = () => { setIsRunning(false); setTimerMode('idle'); setActiveSubjectId(null); setTimeRemaining(0); };
          const skipTimer = () => setTimeRemaining(0);

          const updateCompletedHours = (subjectId, delta) => {
            const currentSchedule = scheduleData[selectedDate] || initialSchedule;
            const updatedDay = currentSchedule[currentDay].map(subject => {
              if (subject.id === subjectId) {
                return { ...subject, completed: Math.max(0, subject.completed + delta) };
              }
              return subject;
            });
            const newFull = { ...scheduleData, [selectedDate]: { ...currentSchedule, [currentDay]: updatedDay } };
            saveToSupabase(newFull);
          };

          const addSubtopic = (subjectId) => {
            const text = (newSubtopicText[subjectId] || '').trim();
            if (!text) return;
            const currentSchedule = scheduleData[selectedDate] || initialSchedule;
            const updatedDay = currentSchedule[currentDay].map(subject => {
              if (subject.id === subjectId) {
                const newSub = { id: 'sub_' + Date.now(), name: text, completed: false };
                return { ...subject, subtopics: [...(subject.subtopics || []), newSub] };
              }
              return subject;
            });
            saveToSupabase({ ...scheduleData, [selectedDate]: { ...currentSchedule, [currentDay]: updatedDay } });
            setNewSubtopicText({ ...newSubtopicText, [subjectId]: '' });
          };

          const toggleSubtopic = (subjectId, subtopicId) => {
            const currentSchedule = scheduleData[selectedDate] || initialSchedule;
            const updatedDay = currentSchedule[currentDay].map(subject => {
              if (subject.id === subjectId) {
                const updatedSubs = (subject.subtopics || []).map(sub => 
                  sub.id === subtopicId ? { ...sub, completed: !sub.completed } : sub
                );
                return { ...subject, subtopics: updatedSubs };
              }
              return subject;
            });
            saveToSupabase({ ...scheduleData, [selectedDate]: { ...currentSchedule, [currentDay]: updatedDay } });
          };

          const deleteSubtopic = (subjectId, subtopicId) => {
            const currentSchedule = scheduleData[selectedDate] || initialSchedule;
            const updatedDay = currentSchedule[currentDay].map(subject => {
              if (subject.id === subjectId) {
                const updatedSubs = (subject.subtopics || []).filter(sub => sub.id !== subtopicId);
                return { ...subject, subtopics: updatedSubs };
              }
              return subject;
            });
            saveToSupabase({ ...scheduleData, [selectedDate]: { ...currentSchedule, [currentDay]: updatedDay } });
          };

          const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
          };

          // Call Gemini API for AI Study Coach
          const handleSendMessage = async (e) => {
            e.preventDefault();
            if (!userInput.trim() || isAiLoading) return;

            const question = userInput.trim();
            setUserInput('');
            setChatMessages(prev => [...prev, { role: 'user', text: question }]);
            setIsAiLoading(true);

            try {
              const systemPrompt = "You are an encouraging and knowledgeable medical study coach helping a student preparing for board exams or medical school rotations. Give concise, highly educational, and motivating advice tailored to subjects like Medicine, Surgery, Pediatrics, and Gyn & Obs.";
              const apiKey = "";
              const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

              const payload = {
                contents: [{ role: 'user', parts: [{ text: `Context: The student is following a strict study schedule including Medicine, Surgery, Commed, Psychiatry, Pediatrics, Gyn & Obs, and Forensic Medicine in 50-minute blocks.\n\nStudent question: ${question}` }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
              };

              const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });

              const result = await response.json();
              const candidate = result.candidates?.[0];

              if (candidate && candidate.content?.parts?.[0]?.text) {
                setChatMessages(prev => [...prev, { role: 'model', text: candidate.content.parts[0].text }]);
              } else {
                setChatMessages(prev => [...prev, { role: 'model', text: "Sorry, I couldn't process that right now. Keep up the great study grind!" }]);
              }
            } catch (err) {
              setChatMessages(prev => [...prev, { role: 'model', text: "Network error connecting to the AI Coach. Please try again." }]);
            } finally {
              setIsAiLoading(false);
            }
          };

          // If not logged in, show login card with Remember Me
          if (!user) {
            return (
              <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
                <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full shadow-2xl space-y-6">
                  <div>
                    <h1 className="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-violet-400">
                      Med-Study Tracker 🚀
                    </h1>
                    <p className="text-slate-400 text-sm mt-1">Log in to access your cloud study data</p>
                  </div>

                  {authError && <div className="p-3 bg-rose-950/50 border border-rose-800 text-rose-300 text-xs rounded-xl">{authError}</div>}

                  <form onSubmit={handleAuth} className="space-y-4">
                    <div>
                      <label className="text-xs font-bold text-slate-400 uppercase">Email</label>
                      <input 
                        type="email" 
                        required
                        value={authEmail} 
                        onChange={(e) => setAuthEmail(e.target.value)} 
                        className="w-full mt-1 bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 outline-none focus:border-cyan-500"
                        placeholder="friend@email.com"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-400 uppercase">Password</label>
                      <input 
                        type="password" 
                        required
                        value={authPassword} 
                        onChange={(e) => setAuthPassword(e.target.value)} 
                        className="w-full mt-1 bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 outline-none focus:border-cyan-500"
                        placeholder="••••••••"
                      />
                    </div>
                    
                    <div className="flex items-center justify-between text-xs text-slate-400 pt-1">
                      <label className="flex items-center gap-2 cursor-pointer">
                        <input 
                          type="checkbox" 
                          checked={rememberMe} 
                          onChange={(e) => setRememberMe(e.target.checked)}
                          className="w-4 h-4 rounded bg-slate-950 border-slate-700 text-cyan-500 focus:ring-cyan-500 cursor-pointer"
                        />
                        Remember Me
                      </label>
                    </div>

                    <button type="submit" className="w-full py-3 bg-gradient-to-r from-cyan-500 to-violet-600 rounded-xl font-bold text-white shadow-lg hover:opacity-95 transition-opacity">
                      {isSignUp ? 'Create Account' : 'Log In'}
                    </button>
                  </form>

                  <div className="text-center">
                    <button onClick={() => setIsSignUp(!isSignUp)} className="text-xs text-cyan-400 hover:underline">
                      {isSignUp ? 'Already have an account? Log in' : "Don't have an account? Sign up"}
                    </button>
                  </div>
                </div>
              </div>
            );
          }

          const currentSubjects = schedule[currentDay] || initialSchedule[currentDay];
          const activeSubject = currentSubjects.find(s => s.id === activeSubjectId);
          const day1Subjects = schedule.day1 || initialSchedule.day1;
          const day2Subjects = schedule.day2 || initialSchedule.day2;
          const day1Completed = day1Subjects.reduce((acc, curr) => acc + curr.completed, 0);
          const day2Completed = day2Subjects.reduce((acc, curr) => acc + curr.completed, 0);
          const totalCompleted = day1Completed + day2Completed;
          const totalTarget = 14;
          const isDayCompleted = totalCompleted >= totalTarget;
          const recordedDates = Object.keys(scheduleData).filter(k => !k.includes('_activeSubject'));

          return (
            <div className="min-h-screen bg-slate-950 text-slate-200 p-4 md:p-8 font-sans">
              <div className="max-w-5xl mx-auto space-y-6">
                
                {/* Header */}
                <header className="flex flex-col lg:flex-row lg:items-center justify-between gap-6 bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl">
                  <div>
                    <h1 className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-violet-400 to-fuchsia-400">
                      Med-Study Tracker 🚀
                    </h1>
                    <p className="text-slate-400 text-sm mt-1">Logged in as: <span className="text-cyan-400 font-semibold">{user.email}</span></p>
                  </div>

                  <div className="flex flex-wrap gap-3 items-center">
                    <button onClick={handleLogout} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-rose-400 text-xs font-bold rounded-xl border border-slate-700">
                      Log Out
                    </button>

                    <div className="flex bg-slate-950 p-1 rounded-2xl border border-slate-800">
                      <button onClick={() => setActiveTab('tracker')} className={`px-4 py-2 rounded-xl text-sm font-bold ${activeTab === 'tracker' ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/30' : 'text-slate-400'}`}>Timer</button>
                      <button onClick={() => setActiveTab('coach')} className={`px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-1.5 ${activeTab === 'coach' ? 'bg-violet-500/20 text-violet-400 border border-violet-500/30' : 'text-slate-400'}`}>AI Coach</button>
                    </div>

                    {activeTab === 'tracker' && (
                      <>
                        <input 
                          type="date" 
                          value={selectedDate} 
                          onChange={(e) => setSelectedDate(e.target.value)}
                          className="bg-slate-950 border border-slate-700 text-slate-200 text-sm rounded-xl p-2.5 outline-none cursor-pointer"
                        />
                        <div className="flex bg-slate-950 p-1 rounded-2xl border border-slate-800">
                          <button onClick={() => setCurrentDay('day1')} className={`px-4 py-2 rounded-xl font-bold text-sm ${currentDay === 'day1' ? 'bg-slate-800 text-violet-400' : 'text-slate-500'}`}>Day 1</button>
                          <button onClick={() => setCurrentDay('day2')} className={`px-4 py-2 rounded-xl font-bold text-sm ${currentDay === 'day2' ? 'bg-slate-800 text-violet-400' : 'text-slate-500'}`}>Day 2</button>
                        </div>
                      </>
                    )}
                  </div>
                </header>

                {activeTab === 'coach' ? (
                  <div className="bg-slate-900 p-6 md:p-8 rounded-3xl border border-slate-800 flex flex-col h-[550px]">
                    <h2 className="text-xl font-bold text-slate-100 mb-4">Gemini Medical AI Coach</h2>
                    <div className="flex-grow overflow-y-auto space-y-4 py-2 pr-2">
                      {chatMessages.map((msg, idx) => (
                        <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                          <div className={`max-w-[80%] p-4 rounded-2xl text-sm ${msg.role === 'user' ? 'bg-violet-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-200 rounded-bl-none border border-slate-700'}`}>
                            {msg.text}
                          </div>
                        </div>
                      ))}
                      {isAiLoading && <div className="text-slate-400 text-sm animate-pulse">Coach is thinking...</div>}
                    </div>
                    <form onSubmit={handleSendMessage} className="pt-4 border-t border-slate-800 flex gap-3">
                      <input 
                        type="text"
                        value={userInput}
                        onChange={(e) => setUserInput(e.target.value)}
                        placeholder="Ask for high-yield notes or study tips..."
                        className="bg-slate-950 border border-slate-700 text-slate-200 text-sm rounded-2xl px-4 py-3 flex-grow outline-none focus:border-violet-500"
                      />
                      <button type="submit" disabled={isAiLoading || !userInput.trim()} className="bg-violet-600 text-white px-6 py-3 rounded-2xl font-bold">Send</button>
                    </form>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    {/* Timer */}
                    <div className="lg:col-span-5 bg-slate-900 p-6 md:p-8 rounded-3xl border border-slate-800 flex flex-col items-center justify-center text-center">
                      {timerMode === 'idle' ? (
                        <div className="mb-6 text-slate-500">
                          <h2 className="text-xl font-bold text-slate-300">Ready to Focus?</h2>
                          <p className="text-sm mt-1">Select a subject to start 50m.</p>
                        </div>
                      ) : (
                        <div className="mb-6">
                          <span className={`px-4 py-1.5 rounded-full text-xs font-bold border ${timerMode === 'study' ? 'bg-violet-900/40 text-violet-300 border-violet-700' : 'bg-cyan-900/40 text-cyan-300 border-cyan-700'}`}>
                            {timerMode === 'study' ? 'Focus Session' : 'Break Time'}
                          </span>
                          {timerMode === 'study' && activeSubject && <h3 className="text-xl font-bold text-slate-100 mt-2">{activeSubject.name}</h3>}
                        </div>
                      )}

                      <div className="text-7xl font-black mb-8 text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-fuchsia-400">
                        {timerMode === 'idle' ? '50:00' : formatTime(timeRemaining)}
                      </div>

                      <div className="flex gap-4">
                        <button onClick={toggleTimer} disabled={timerMode === 'idle'} className="p-4 rounded-full bg-violet-600 text-white disabled:opacity-30">
                          {isRunning ? 'Pause' : 'Play'}
                        </button>
                        <button onClick={stopTimer} disabled={timerMode === 'idle'} className="p-4 rounded-full bg-slate-800 text-slate-400 disabled:opacity-30">Stop</button>
                        <button onClick={skipTimer} disabled={timerMode === 'idle'} className="p-4 rounded-full bg-slate-800 text-slate-400 disabled:opacity-30">Skip</button>
                      </div>
                    </div>

                    {/* Schedule & Progress & Subtopics */}
                    <div className="lg:col-span-7 bg-slate-900 p-6 md:p-8 rounded-3xl border border-slate-800 space-y-4">
                      <h2 className="text-xl font-bold text-slate-100">{currentDay === 'day1' ? 'Day 1 Schedule' : 'Day 2 Schedule'}</h2>
                      
                      {currentSubjects.map(subject => {
                        const isComplete = subject.completed >= subject.target;
                        const isActive = activeSubjectId === subject.id && timerMode === 'study';

                        return (
                          <div key={subject.id} className={`p-4 rounded-2xl border ${isActive ? 'border-violet-500 bg-violet-950/20' : 'border-slate-800 bg-slate-950/40'}`}>
                            <div className="flex items-center justify-between mb-2">
                              <div>
                                <h3 className="font-bold text-slate-200">{subject.name}</h3>
                                <p className="text-xs text-slate-400">{subject.completed} / {subject.target} sessions</p>
                              </div>
                              <div className="flex items-center gap-2">
                                <div className="flex bg-slate-900 border border-slate-800 rounded-lg overflow-hidden">
                                  <button onClick={() => updateCompletedHours(subject.id, -1)} className="px-2 py-1 text-slate-400 hover:bg-slate-800">-</button>
                                  <span className="px-2 py-1 text-xs">{subject.completed}h</span>
                                  <button onClick={() => updateCompletedHours(subject.id, 1)} className="px-2 py-1 text-slate-400 hover:bg-slate-800">+</button>
                                </div>
                                <button onClick={() => startStudySession(subject.id)} className="px-4 py-2 bg-slate-800 text-violet-400 rounded-xl text-xs font-bold hover:bg-slate-700">
                                  {isActive ? 'Running' : 'Start 50m'}
                                </button>
                              </div>
                            </div>

                            {/* Subtopics Checklist */}
                            <div className="mt-3 pt-3 border-t border-slate-800/80 space-y-2">
                              <p className="text-xs font-bold text-slate-400 uppercase">Subtopics</p>
                              {subject.subtopics && subject.subtopics.map(sub => (
                                <div key={sub.id} className="flex items-center justify-between bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-800">
                                  <span onClick={() => toggleSubtopic(subject.id, sub.id)} className={`text-xs cursor-pointer ${sub.completed ? 'line-through text-slate-500' : 'text-slate-300'}`}>
                                    {sub.name}
                                  </span>
                                  <button onClick={() => deleteSubtopic(subject.id, sub.id)} className="text-rose-400 text-xs">×</button>
                                </div>
                              ))}
                              <div className="flex gap-2 mt-2">
                                <input 
                                  type="text" 
                                  value={newSubtopicText[subject.id] || ''}
                                  onChange={(e) => setNewSubtopicText({ ...newSubtopicText, [subject.id]: e.target.value })}
                                  placeholder="Add subtopic..."
                                  className="bg-slate-900 border border-slate-800 text-xs text-slate-200 rounded-xl px-3 py-1.5 flex-grow outline-none"
                                />
                                <button onClick={() => addSubtopic(subject.id)} className="bg-slate-800 px-3 py-1.5 rounded-xl text-xs font-semibold">Add</button>
                              </div>
                            </div>
                          </div>
                        );
                      })}

                      {/* 14-Hour Progress Bar */}
                      <div className="mt-6 pt-4 border-t border-slate-800">
                        <div className="flex justify-between text-xs font-bold text-slate-400 mb-2">
                          <span>Total Daily Target</span>
                          <span className={isDayCompleted ? 'text-amber-400 font-extrabold' : 'text-slate-200'}>{totalCompleted} / 14 hrs</span>
                        </div>
                        <div className="h-3 w-full bg-slate-950 rounded-full overflow-hidden border border-slate-800 relative">
                          <div 
                            className={`h-full transition-all duration-700 ${isDayCompleted ? 'bg-gradient-to-r from-amber-400 to-yellow-500 animate-pulse' : 'bg-gradient-to-r from-violet-500 to-fuchsia-500'}`}
                            style={{ width: `${Math.min(100, (totalCompleted / 14) * 100)}%` }}
                          ></div>
                        </div>
                        {isDayCompleted && (
                          <p className="text-center text-amber-400 font-bold text-xs mt-2 animate-bounce">
                            🎉 14-Hour Daily Goal Achieved! Great job! 🎉
                          </p>
                        )}
                      </div>

                    </div>
                  </div>
                )}

              </div>
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
