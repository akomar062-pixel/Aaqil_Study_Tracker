<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Med-Study Tracker</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for compiling JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- FontAwesome for robust, crash-free icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* Custom Animations for 14-Hour Progress Bar */
        .gold-glow { box-shadow: 0 0 25px rgba(251, 191, 36, 0.7); }
        .progress-pulse { animation: pulse-gold 2s infinite; }
        @keyframes pulse-gold {
            0% { box-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }
            50% { box-shadow: 0 0 30px rgba(251, 191, 36, 0.9); }
            100% { box-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
        /* Hide scrollbar for a cleaner look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen font-sans text-lg">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // --- CONFIGURE YOUR SUPABASE HERE ---
        const SUPABASE_URL = 'https://lkltuvpdrebexvoekywb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxrbHR1dnBkcmViZXh2b2VreXdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NTIzMTksImV4cCI6MjEwNDAyODMxOX0.cCgvCZ7eZFqefAEp3aiEzqFfI3bBsZMN4fd1ujsdBNE'; 
        
        const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        const STUDY_DURATION = 50 * 60; // 50 mins in seconds
        const BREAK_DURATION = 10 * 60; // 10 mins in seconds
        const TARGET_DAILY_HOURS = 14;

        // Updated subject configuration per user request
        const initialSchedule = {
          day1: [
            { id: 'm1', name: 'Medicine', target: 4, completed: 0, subtopics: [] },
            { id: 'pe1', name: 'Pediatrics', target: 4, completed: 0, subtopics: [] },
            { id: 'c1', name: 'Commed', target: 4, completed: 0, subtopics: [] },
            { id: 'psy1', name: 'Psychiatry', target: 2, completed: 0, subtopics: [] },
          ],
          day2: [
            { id: 's1', name: 'Surgery', target: 4, completed: 0, subtopics: [] },
            { id: 'g1', name: 'Gyn & Obs', target: 4, completed: 0, subtopics: [] },
            { id: 'f1', name: 'Forensic', target: 4, completed: 0, subtopics: [] },
            { id: 'psy2', name: 'Psychiatry', target: 2, completed: 0, subtopics: [] },
          ]
        };

        const playAudioNotification = (type) => {
          try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gainNode = ctx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(ctx.destination);
            
            if (type === 'study-end') {
              osc.type = 'sine';
              osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
              osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.2); // E5
            } else {
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(880, ctx.currentTime); // A5
              osc.frequency.setValueAtTime(440, ctx.currentTime + 0.2); // A4
            }
            
            gainNode.gain.setValueAtTime(0.5, ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
            
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.8);
          } catch (err) {
            console.log("Audio blocked by browser, please interact with the page first.", err);
          }
        };

        function App() {
          // Auth State
          const [user, setUser] = useState(null);
          const [authEmail, setAuthEmail] = useState('');
          const [authPassword, setAuthPassword] = useState('');
          const [isLoginView, setIsLoginView] = useState(true);
          const [authError, setAuthError] = useState('');
          const [authLoading, setAuthLoading] = useState(false);
          const [rememberMe, setRememberMe] = useState(true);

          // Real-time local date calculation (YYYY-MM-DD)
          // Adjusted to reset the study day at 10:00 AM for late-night studying
          const getTodayString = () => {
            const now = new Date();
            if (now.getHours() < 10) {
              now.setDate(now.getDate() - 1);
            }
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
          };

          const [selectedDate, setSelectedDate] = useState(getTodayString());
          const [currentDay, setCurrentDay] = useState('day1');
          const [scheduleData, setScheduleData] = useState({});
          
          const [newSubtopicText, setNewSubtopicText] = useState({});
          
          const [timerMode, setTimerMode] = useState('idle');
          const [timeRemaining, setTimeRemaining] = useState(0);
          const [isRunning, setIsRunning] = useState(false);
          const [activeSubjectId, setActiveSubjectId] = useState(null);
          
          const [dbError, setDbError] = useState(null);
          const [studyHistory, setStudyHistory] = useState([]);
          const [showHistory, setShowHistory] = useState(false);

          useEffect(() => {
            if (!supabase) return;
            // Remember me feature: Checks if you are already logged in on page load
            supabase.auth.getSession().then(({ data: { session } }) => {
              if (session?.user) setUser(session.user);
            });

            // Listen for login/logout events
            const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
              setUser(session?.user ?? null);
            });

            return () => subscription.unsubscribe();
          }, []);

          const handleAuth = async (e) => {
            e.preventDefault();
            if (!supabase) { setAuthError("Supabase error: Check API keys."); return; }
            setAuthLoading(true); 
            setAuthError('');
            
            try {
              if (isLoginView) {
                const { data, error } = await supabase.auth.signInWithPassword({ email: authEmail, password: authPassword });
                if (error) throw error;
                setUser(data.user);
              } else {
                const { data, error } = await supabase.auth.signUp({ email: authEmail, password: authPassword });
                if (error) throw error;
                if (data?.user) setUser(data.user);
                else setAuthError("Signup successful! Please check your email or log in.");
              }
            } catch (err) { 
              setAuthError(err.message); 
            } finally { 
              setAuthLoading(false); 
            }
          };

          const handleLogout = async () => {
            if (!supabase) return;
            await supabase.auth.signOut();
            setUser(null);
            setScheduleData({}); // Clear local data on logout
          };

          const todayString = getTodayString();
          const isToday = selectedDate === todayString;

          useEffect(() => {
            async function fetchData() {
              if (!supabase || !user) return;
              
              setDbError(null);
              
              try {
                // Fetch ALL historical records for this user
                const { data: historyData, error: historyError } = await supabase
                  .from('study_records')
                  .select('date_key, data')
                  .eq('user_id', user.id)
                  .order('date_key', { ascending: false });
                
                if (historyError) throw historyError;

                if (historyData) {
                  setStudyHistory(historyData);
                }

                const todayData = historyData?.find(r => r.date_key === selectedDate);

                if (todayData) {
                  const savedData = todayData.data;
                  
                  const mergeDay = (savedDay, initialDay) => {
                    return initialDay.map(initialSubj => {
                      const savedSubj = (savedDay || []).find(s => s.id === initialSubj.id);
                      if (savedSubj) {
                        return { ...initialSubj, completed: savedSubj.completed, subtopics: savedSubj.subtopics || [] };
                      }
                      return initialSubj;
                    });
                  };

                  const mergedData = {
                    day1: mergeDay(savedData.day1, initialSchedule.day1),
                    day2: mergeDay(savedData.day2, initialSchedule.day2)
                  };

                  setScheduleData(prev => ({ ...prev, [selectedDate]: mergedData }));
                } else {
                  setScheduleData(prev => ({ ...prev, [selectedDate]: initialSchedule }));
                }
              } catch (err) {
                console.error("Error fetching data:", err);
                setDbError(`Failed to load data for ${selectedDate}: ${err.message}.`);
              }
            }
            fetchData();
          }, [selectedDate, user]);

          const saveToSupabase = async (newDateData) => {
            setScheduleData(prev => ({ ...prev, [selectedDate]: newDateData }));
            setDbError(null);
            
            if (!supabase || !user) return;
            
            try {
              const { data: existing, error: selectError } = await supabase
                .from('study_records')
                .select('id')
                .eq('user_id', user.id)
                .eq('date_key', selectedDate);
                
              if (selectError) throw selectError;

              if (existing && existing.length > 0) {
                const { error: updateError } = await supabase
                  .from('study_records')
                  .update({ data: newDateData })
                  .eq('id', existing[0].id);
                if (updateError) throw updateError;
              } else {
                const { error: insertError } = await supabase
                  .from('study_records')
                  .insert([{ user_id: user.id, date_key: selectedDate, data: newDateData }]);
                if (insertError) throw insertError;
              }

              // Update local history array instantly so the UI reflects it
              setStudyHistory(prev => {
                const existingIndex = prev.findIndex(r => r.date_key === selectedDate);
                const newRecord = { date_key: selectedDate, data: newDateData };
                if (existingIndex >= 0) {
                  const updated = [...prev];
                  updated[existingIndex] = newRecord;
                  return updated;
                }
                return [newRecord, ...prev].sort((a, b) => b.date_key.localeCompare(a.date_key));
              });

            } catch (err) {
              console.error("Error saving data:", err);
              setDbError(`Failed to save progress: ${err.message}. (Check Supabase RLS policies!)`);
            }
          };

          useEffect(() => {
            let interval = null;
            if (isRunning && timeRemaining > 0) {
              interval = setInterval(() => setTimeRemaining(prev => prev - 1), 1000);
            } else if (isRunning && timeRemaining === 0) {
              handleTimerComplete();
            }
            return () => clearInterval(interval);
          }, [isRunning, timeRemaining]);

          const handleTimerComplete = () => {
            if (timerMode === 'study') {
              playAudioNotification('study-end');
              
              if (activeSubjectId) {
                const currentSchedule = scheduleData[selectedDate] || initialSchedule;
                const updatedDay = currentSchedule[currentDay].map(subject => 
                  subject.id === activeSubjectId ? { ...subject, completed: subject.completed + 1 } : subject
                );
                saveToSupabase({ ...currentSchedule, [currentDay]: updatedDay });
              }
              setTimerMode('break');
              setTimeRemaining(BREAK_DURATION);
              setIsRunning(true);
              
            } else if (timerMode === 'break') {
              playAudioNotification('break-end');
              setTimerMode('idle');
              setActiveSubjectId(null);
              setIsRunning(false);
            }
          };

          const startStudySession = (subjectId) => {
            setActiveSubjectId(subjectId);
            setTimerMode('study');
            setTimeRemaining(STUDY_DURATION);
            setIsRunning(true);
          };

          const toggleTimer = () => setIsRunning(!isRunning);
          const stopTimer = () => { setIsRunning(false); setTimerMode('idle'); setActiveSubjectId(null); setTimeRemaining(0); };
          const skipTimer = () => setTimeRemaining(0);

          const addSubtopic = (subjectId) => {
            const text = (newSubtopicText[subjectId] || '').trim();
            if (!text) return;
            const currentSchedule = scheduleData[selectedDate] || initialSchedule;
            const updatedDay = currentSchedule[currentDay].map(subject => {
              if (subject.id === subjectId) {
                const newSub = { id: 'sub_' + Date.now(), name: text, completed: false };
                return { ...subject, subtopics: [...(subject.subtopics || []), newSub] };
              }
              return subject;
            });
            saveToSupabase({ ...currentSchedule, [currentDay]: updatedDay });
            setNewSubtopicText({ ...newSubtopicText, [subjectId]: '' });
          };

          const toggleSubtopic = (subjectId, subtopicId) => {
            const currentSchedule = scheduleData[selectedDate] || initialSchedule;
            const updatedDay = currentSchedule[currentDay].map(subject => {
              if (subject.id === subjectId) {
                const updatedSubs = (subject.subtopics || []).map(sub => 
                  sub.id === subtopicId ? { ...sub, completed: !sub.completed } : sub
                );
                return { ...subject, subtopics: updatedSubs };
              }
              return subject;
            });
            saveToSupabase({ ...currentSchedule, [currentDay]: updatedDay });
          };

          const deleteSubtopic = (subjectId, subtopicId) => {
            const currentSchedule = scheduleData[selectedDate] || initialSchedule;
            const updatedDay = currentSchedule[currentDay].map(subject => {
              if (subject.id === subjectId) {
                const updatedSubs = (subject.subtopics || []).filter(sub => sub.id !== subtopicId);
                return { ...subject, subtopics: updatedSubs };
              }
              return subject;
            });
            saveToSupabase({ ...currentSchedule, [currentDay]: updatedDay });
          };

          const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
          };

          if (!user) {
            return (
              <div className="min-h-screen flex items-center justify-center p-4">
                <div className="bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-xl w-full max-w-lg">
                  <h1 className="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-violet-400 to-fuchsia-400 mb-2 flex items-center gap-3">
                    Med-Study Tracker <i className="fas fa-rocket text-cyan-400 text-3xl"></i>
                  </h1>
                  <p className="text-slate-400 text-lg mb-8">Log in to sync your study data to your private cloud.</p>
                  
                  {authError && <div className="bg-rose-900/30 text-rose-400 p-4 rounded-xl mb-6 text-base border border-rose-800/50 flex items-center gap-2"><i className="fas fa-circle-exclamation"></i> {authError}</div>}
                  
                  <form onSubmit={handleAuth} className="space-y-6">
                    <div>
                      <label className="block text-sm font-bold text-slate-400 mb-2">EMAIL ADDRESS</label>
                      <input type="email" required value={authEmail} onChange={e => setAuthEmail(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-5 py-4 text-xl text-slate-200 outline-none focus:border-cyan-500 transition shadow-inner" placeholder="doctor@medschool.com" />
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-slate-400 mb-2">PASSWORD</label>
                      <input type="password" required value={authPassword} onChange={e => setAuthPassword(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-5 py-4 text-xl text-slate-200 outline-none focus:border-cyan-500 transition shadow-inner" placeholder="••••••••" />
                    </div>
                    
                    <div className="flex items-center gap-3 mt-4">
                      <input type="checkbox" id="remember" checked={rememberMe} onChange={() => setRememberMe(!rememberMe)} className="w-5 h-5 accent-cyan-500 cursor-pointer rounded" />
                      <label htmlFor="remember" className="text-base text-slate-300 cursor-pointer font-medium">Remember me (Keep me logged in)</label>
                    </div>

                    <button type="submit" disabled={authLoading} className="w-full bg-gradient-to-r from-cyan-600 to-violet-600 hover:from-cyan-500 hover:to-violet-500 text-white font-bold text-xl py-4 rounded-2xl shadow-lg transition disabled:opacity-50 mt-4 flex justify-center items-center gap-2">
                      {authLoading ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-right-to-bracket"></i>}
                      {authLoading ? 'Processing...' : isLoginView ? 'Sign In' : 'Create Secure Account'}
                    </button>
                  </form>
                  
                  <p className="text-center text-base text-slate-400 mt-8 cursor-pointer hover:text-cyan-400 transition" onClick={() => setIsLoginView(!isLoginView)}>
                    {isLoginView ? "Don't have an account? Create one here." : "Already have an account? Sign in here."}
                  </p>
                </div>
              </div>
            );
          }

          const currentSubjects = (scheduleData[selectedDate] || initialSchedule)[currentDay] || [];
          const activeSubject = currentSubjects.find(s => s.id === activeSubjectId);
          
          const dateSchedule = scheduleData[selectedDate] || initialSchedule;
          const totalCompletedHours = (dateSchedule.day1 || []).reduce((acc, curr) => acc + curr.completed, 0) + 
                                      (dateSchedule.day2 || []).reduce((acc, curr) => acc + curr.completed, 0);
          
          const isTargetMet = totalCompletedHours >= TARGET_DAILY_HOURS;
          const progressPercent = Math.min(100, (totalCompletedHours / TARGET_DAILY_HOURS) * 100);

          return (
            <div className="max-w-6xl mx-auto space-y-8 p-4 md:p-8">
              
              {dbError && (
                <div className="bg-rose-900/90 text-rose-200 p-4 rounded-2xl border-2 border-rose-500 shadow-lg flex items-center justify-between animate-pulse">
                  <div className="flex items-center gap-3">
                    <i className="fas fa-triangle-exclamation text-2xl text-rose-400"></i>
                    <div>
                        <strong className="block text-lg">Cloud Sync Failed!</strong>
                        <span className="text-sm">{dbError}</span>
                    </div>
                  </div>
                  <button onClick={() => setDbError(null)} className="text-rose-400 hover:text-rose-200"><i className="fas fa-xmark text-xl"></i></button>
                </div>
              )}

              {/* Header section */}
              <header className="flex flex-col xl:flex-row xl:items-center justify-between gap-6 bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-xl relative overflow-hidden">
                <div className="relative z-10">
                  <h1 className="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-violet-400 to-fuchsia-400">
                    Med-Study Tracker
                  </h1>
                  <p className="text-slate-400 text-base mt-2 flex items-center gap-2">
                    <i className="fas fa-user-circle text-lg"></i> Logged in as <strong className="text-slate-300">{user.email}</strong>
                  </p>
                </div>

                <div className="flex flex-wrap gap-4 items-center relative z-10">
                  <div className="flex items-center gap-2">
                    <input type="date" value={selectedDate} onChange={(e) => { setSelectedDate(e.target.value); stopTimer(); }} className="bg-slate-950 border border-slate-700 text-slate-200 text-lg rounded-xl px-4 py-3 outline-none cursor-pointer hover:border-cyan-500 transition" />
                    {!isToday && (
                      <button onClick={() => { setSelectedDate(todayString); stopTimer(); setShowHistory(false); }} className="px-4 py-3 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold transition shadow-md whitespace-nowrap">
                        Go to Today
                      </button>
                    )}
                  </div>
                  
                  <div className="flex bg-slate-950 p-1.5 rounded-2xl border border-slate-800">
                    <button onClick={() => { setCurrentDay('day1'); stopTimer(); }} className={`px-6 py-3 rounded-xl font-bold text-lg transition-all ${currentDay === 'day1' ? 'bg-slate-800 text-violet-400 shadow-md' : 'text-slate-500 hover:text-slate-300'}`}>Day 1</button>
                    <button onClick={() => { setCurrentDay('day2'); stopTimer(); }} className={`px-6 py-3 rounded-xl font-bold text-lg transition-all ${currentDay === 'day2' ? 'bg-slate-800 text-violet-400 shadow-md' : 'text-slate-500 hover:text-slate-300'}`}>Day 2</button>
                  </div>
                  
                  <button onClick={() => setShowHistory(!showHistory)} className={`px-6 py-3 rounded-xl font-bold text-lg transition-all border shadow-sm flex items-center gap-2 ${showHistory ? 'bg-cyan-900/30 text-cyan-400 border-cyan-800/50' : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border-transparent hover:border-slate-600'}`}>
                    <i className="fas fa-chart-simple"></i> History
                  </button>

                  <button onClick={handleLogout} className="px-6 py-3 bg-slate-800 hover:bg-rose-900 hover:text-rose-200 rounded-xl text-rose-400 font-bold text-lg transition border border-transparent hover:border-rose-800 shadow-sm flex items-center gap-2">
                    <i className="fas fa-arrow-right-from-bracket"></i> Logout
                  </button>
                </div>
              </header>

              {showHistory && (
                <div className="bg-slate-900 p-8 rounded-3xl border border-cyan-800/50 shadow-xl mb-8 animate-fade-in relative z-20">
                  <div className="flex items-center justify-between mb-6">
                    <h2 className="text-2xl font-extrabold text-cyan-400 flex items-center gap-3">
                      <i className="fas fa-calendar-check"></i> Study History Log
                    </h2>
                    <button onClick={() => setShowHistory(false)} className="text-slate-400 hover:text-rose-400"><i className="fas fa-xmark text-3xl"></i></button>
                  </div>
                  
                  {studyHistory.length === 0 ? (
                    <p className="text-slate-400 text-lg">No study records found yet. Finish your first 50m block!</p>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                      {studyHistory.map(record => {
                        const day1Total = (record.data.day1 || []).reduce((acc, curr) => acc + curr.completed, 0);
                        const day2Total = (record.data.day2 || []).reduce((acc, curr) => acc + curr.completed, 0);
                        const totalHours = day1Total + day2Total;
                        const hitGoal = totalHours >= TARGET_DAILY_HOURS;
                        const isCurrentDate = record.date_key === selectedDate;
                        
                        return (
                          <div key={record.date_key} onClick={() => { setSelectedDate(record.date_key); setShowHistory(false); }} className={`p-5 rounded-2xl border-2 cursor-pointer transition-all hover:scale-105 ${isCurrentDate ? 'bg-cyan-900/30 border-cyan-500 shadow-lg' : hitGoal ? 'bg-amber-500/10 border-amber-500/50' : 'bg-slate-950 border-slate-800 hover:border-cyan-500/50'}`}>
                            <p className={`font-bold text-lg mb-1 ${hitGoal ? 'text-amber-400' : 'text-slate-200'}`}>
                              {record.date_key} {hitGoal && <i className="fas fa-star text-amber-500 ml-1 drop-shadow-md"></i>}
                            </p>
                            <div className="flex items-end justify-between mt-3">
                              <span className="text-slate-400 text-sm font-medium">Total Completed:</span>
                              <span className={`text-2xl font-black ${hitGoal ? 'text-amber-400' : 'text-cyan-400'}`}>{totalHours}h</span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}

              {}
              <div className={`bg-slate-900 p-8 rounded-3xl border ${isTargetMet ? 'border-amber-500 gold-glow progress-pulse' : 'border-slate-800 shadow-lg'}`}>
                <div className="flex justify-between items-end mb-4">
                  <div>
                    <h2 className={`font-extrabold text-2xl flex items-center gap-3 ${isTargetMet ? 'text-amber-400' : 'text-slate-100'}`}>
                      Daily Target: 14 Hours {isTargetMet && <i className="fas fa-trophy text-amber-500"></i>}
                    </h2>
                    <p className="text-base text-slate-400 mt-1">Total hours completed on {selectedDate}</p>
                  </div>
                  <span className={`font-black text-3xl ${isTargetMet ? 'text-amber-400' : 'text-cyan-400'}`}>
                    {totalCompletedHours} <span className="text-xl text-slate-500 font-bold">/ 14</span>
                  </span>
                </div>
                
                <div className="h-6 w-full bg-slate-950 rounded-full overflow-hidden shadow-inner border border-slate-800">
                  <div 
                    className={`h-full transition-all duration-1000 ease-out ${isTargetMet ? 'bg-gradient-to-r from-amber-400 via-yellow-300 to-amber-500' : 'bg-gradient-to-r from-cyan-500 to-violet-500'}`}
                    style={{ width: `${progressPercent}%` }}
                  ></div>
                </div>
                
                {isTargetMet && (
                  <p className="text-amber-400 text-center font-bold mt-5 text-lg animate-bounce flex justify-center items-center gap-2">
                    <i className="fas fa-star"></i> Incredible! You hit your 14-hour study goal for {selectedDate}! <i className="fas fa-star"></i>
                  </p>
                )}
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                
                {/* Timer Box */}
                <div className="lg:col-span-5 bg-slate-900 p-8 rounded-3xl border border-slate-800 flex flex-col items-center justify-center text-center shadow-xl relative overflow-hidden min-h-[450px]">
                   <div className={`absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 rounded-full blur-3xl opacity-10 pointer-events-none transition-all duration-1000 ${timerMode === 'study' ? 'bg-violet-500' : timerMode === 'break' ? 'bg-cyan-500' : 'bg-transparent'}`}></div>

                  {!isToday ? (
                    <div className="mb-8 relative z-10">
                      <i className="fas fa-lock text-5xl text-slate-700 mb-4 block"></i>
                      <h2 className="text-2xl font-bold text-slate-400">History Mode</h2>
                      <p className="text-lg text-slate-500 mt-2">Return to today to start studying.</p>
                    </div>
                  ) : timerMode === 'idle' ? (
                    <div className="mb-8 relative z-10">
                      <i className="fas fa-book-open text-5xl text-slate-700 mb-4 block"></i>
                      <h2 className="text-2xl font-bold text-slate-300">Ready to Focus?</h2>
                      <p className="text-lg text-slate-500 mt-2">Select a subject to start 50m.</p>
                    </div>
                  ) : (
                    <div className="mb-8 relative z-10">
                      <span className={`px-5 py-2 rounded-full text-sm font-bold border flex items-center justify-center gap-2 mx-auto w-max ${timerMode === 'study' ? 'bg-violet-900/40 text-violet-300 border-violet-700/50' : 'bg-cyan-900/40 text-cyan-300 border-cyan-700/50'}`}>
                        {timerMode === 'study' ? <i className="fas fa-brain"></i> : <i className="fas fa-mug-hot"></i>}
                        {timerMode === 'study' ? 'Focus Session' : 'Break Time'}
                      </span>
                      {timerMode === 'study' && activeSubject && <h3 className="text-3xl font-extrabold text-slate-100 mt-4">{activeSubject.name}</h3>}
                    </div>
                  )}

                  <div className={`text-8xl font-black mb-10 relative z-10 tabular-nums tracking-tighter drop-shadow-md ${timerMode === 'idle' ? 'text-slate-700' : timerMode === 'break' ? 'text-cyan-400' : 'text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-fuchsia-400'}`}>
                    {timerMode === 'idle' ? '50:00' : formatTime(timeRemaining)}
                  </div>

                  <div className="flex gap-5 relative z-10">
                    <button onClick={toggleTimer} disabled={timerMode === 'idle' || !isToday} className={`w-20 h-20 rounded-full flex items-center justify-center transition-all ${timerMode === 'idle' || !isToday ? 'bg-slate-800 text-slate-600 cursor-not-allowed' : isRunning ? 'bg-amber-600 text-white shadow-lg hover:bg-amber-500' : 'bg-violet-600 text-white shadow-lg hover:bg-violet-500'}`}>
                      {isRunning ? <i className="fas fa-pause text-3xl"></i> : <i className="fas fa-play text-3xl ml-1"></i>}
                    </button>
                    <button onClick={stopTimer} disabled={timerMode === 'idle' || !isToday} className="w-16 h-16 rounded-full bg-slate-800 text-slate-400 disabled:opacity-30 hover:bg-slate-700 hover:text-rose-400 transition-colors flex items-center justify-center shadow-md">
                      <i className="fas fa-square text-xl"></i>
                    </button>
                    <button onClick={skipTimer} disabled={timerMode === 'idle' || !isToday} className="w-16 h-16 rounded-full bg-slate-800 text-slate-400 disabled:opacity-30 hover:bg-slate-700 hover:text-cyan-400 transition-colors flex items-center justify-center shadow-md">
                      <i className="fas fa-forward-step text-xl"></i>
                    </button>
                  </div>
                </div>

                {/* Schedule & Subtopics List */}
                <div className="lg:col-span-7 bg-slate-900 p-8 rounded-3xl border border-slate-800 space-y-5 shadow-xl">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <h2 className="text-2xl font-extrabold text-slate-100 flex items-center gap-3">
                      <i className="fas fa-list-check text-violet-400"></i>
                      {currentDay === 'day1' ? 'Day 1' : 'Day 2'} — <span className="text-cyan-400">{selectedDate}</span>
                    </h2>
                    {!isToday && (
                      <span className="px-4 py-2 text-sm font-bold bg-amber-500/10 text-amber-500 border border-amber-500/30 rounded-xl flex items-center gap-2">
                        <i className="fas fa-lock"></i> Read Only
                      </span>
                    )}
                  </div>
                  
                  {currentSubjects.map(subject => {
                    const isComplete = subject.completed >= subject.target;
                    const isActive = activeSubjectId === subject.id && timerMode === 'study';

                    return (
                      <div key={subject.id} className={`p-6 rounded-2xl border-2 transition-all ${isActive ? 'border-violet-500 bg-violet-950/30 shadow-lg' : isComplete ? 'border-cyan-800/50 bg-cyan-900/10' : 'border-slate-800 bg-slate-950/60 hover:border-slate-700'}`}>
                        <div className="flex items-center justify-between mb-4">
                          <div>
                            <h3 className={`font-bold text-xl flex items-center gap-2 ${isActive ? 'text-violet-300' : isComplete ? 'text-cyan-400' : 'text-slate-100'}`}>
                              {subject.name} {isComplete && <i className="fas fa-circle-check text-cyan-500"></i>}
                            </h3>
                            <p className="text-sm text-slate-400 mt-1 font-medium">{subject.completed} / {subject.target} sessions completed</p>
                          </div>
                          
                          {!isComplete ? (
                            <button onClick={() => startStudySession(subject.id)} disabled={isActive || !isToday} className={`px-6 py-3 rounded-xl text-sm font-bold transition-all shadow-sm ${isActive ? 'bg-violet-900/40 text-violet-500 cursor-not-allowed' : !isToday ? 'bg-slate-800/50 text-slate-500 cursor-not-allowed opacity-60' : 'bg-slate-800 text-violet-400 hover:bg-violet-600 hover:text-white hover:shadow-violet-900/50 border border-violet-800/30'}`}>
                              {isActive ? (
                                <><i className="fas fa-spinner fa-spin mr-2"></i>Running</>
                              ) : !isToday ? (
                                <><i className="fas fa-lock mr-2"></i>Locked</>
                              ) : (
                                <><i className="fas fa-play mr-2"></i>Start 50m</>
                              )}
                            </button>
                          ) : (
                            <span className="px-5 py-2.5 rounded-xl text-sm font-bold bg-cyan-900/30 text-cyan-400 border border-cyan-800/50 flex items-center gap-2">
                              <i className="fas fa-check"></i> Done
                            </span>
                          )}
                        </div>

                        <div className="h-2.5 w-full bg-slate-950 rounded-full overflow-hidden border border-slate-800 mb-5">
                          <div className={`h-full transition-all duration-700 ${isComplete ? 'bg-cyan-500' : 'bg-violet-500'}`} style={{ width: `${Math.min(100, (subject.completed / subject.target) * 100)}%` }}></div>
                        </div>

                        <div className="pt-4 border-t border-slate-800/80 space-y-3">
                          <p className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-2">Subtopics Checklist</p>
                          
                          {subject.subtopics && subject.subtopics.map(sub => (
                            <div key={sub.id} className="flex items-center justify-between bg-slate-900 px-4 py-3 rounded-xl border border-slate-700/60 group hover:border-slate-600 transition-colors">
                              <span onClick={() => isToday && toggleSubtopic(subject.id, sub.id)} className={`text-base flex-grow flex items-center gap-3 select-none ${isToday ? 'cursor-pointer' : 'cursor-not-allowed'} ${sub.completed ? 'line-through text-slate-500' : 'text-slate-200'}`}>
                                <i className={`fas ${sub.completed ? 'fa-square-check text-cyan-400 text-lg' : 'fa-square text-slate-600 text-lg'}`}></i>
                                {sub.name}
                              </span>
                              {isToday && (
                                <button onClick={() => deleteSubtopic(subject.id, sub.id)} className="text-slate-500 hover:text-rose-400 p-2 opacity-0 group-hover:opacity-100 transition-opacity" title="Delete Subtopic">
                                  <i className="fas fa-trash-can"></i>
                                </button>
                              )}
                            </div>
                          ))}
                          
                          {isToday && (
                            <div className="flex gap-3 mt-3">
                              <input 
                                type="text" 
                                value={newSubtopicText[subject.id] || ''}
                                onChange={(e) => setNewSubtopicText({ ...newSubtopicText, [subject.id]: e.target.value })}
                                onKeyDown={(e) => { if(e.key === 'Enter') addSubtopic(subject.id); }}
                                placeholder="Add a new subtopic..."
                                className="bg-slate-950 border border-slate-800 text-base text-slate-200 rounded-xl px-4 py-3 flex-grow outline-none focus:border-cyan-500 shadow-inner transition"
                              />
                              <button onClick={() => addSubtopic(subject.id)} className="bg-slate-800 hover:bg-slate-700 px-6 py-3 rounded-xl text-base font-bold transition-colors text-slate-200 border border-slate-700/50 flex items-center gap-2 shadow-sm">
                                <i className="fas fa-plus"></i> Add
                              </button>
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
